<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado ENEM</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Loading -->
    <button id="mobile-menu-btn">☰</button>

    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
    </div>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>🎓 Simulado ENEM</h2>

            <ul>
                <li data-section="gerar" class="active">Gerar Prova</li>
                <li data-section="enem">Simulado ENEM</li>
                <li data-section="dashboard">Dashboard</li>
                <li data-section="ranking">Ranking</li>
                <li data-section="redacao">Redação</li>
                <li data-section="config">Config</li>
            </ul>

            <button id="logout-btn" class="btn-red">
                Logout
            </button>
        </aside>

        <!-- Conteúdo -->
        <main class="main-content">

            <!-- GERAR PROVA -->
            <section id="gerar" class="section">
                <h1>Gerar Prova</h1>

                <div class="card">
                    <input
                        type="text"
                        id="faculdade"
                        placeholder="Faculdade"
                    >

                    <input
                        type="text"
                        id="curso"
                        placeholder="Curso"
                    >

                    <input
                        type="number"
                        id="quantidade"
                        placeholder="Quantidade"
                    >

                    <button id="gerar-btn">
                        Gerar Prova
                    </button>

                    <p id="tempo-prova"></p>
                </div>

                <div id="prova-container"></div>

                <button
                    id="finalizar-btn"
                    class="hidden success-btn"
                >
                    Finalizar
                </button>
            </section>

            <!-- ENEM COMPLETO -->
            <section id="enem" class="section hidden">
                <h1>ENEM Completo</h1>

                <button id="enem-btn">
                    Gerar ENEM
                </button>

                <div id="enem-container"></div>
            </section>

            <!-- DASHBOARD -->
            <section id="dashboard" class="section hidden">
                <h1>Dashboard</h1>

                <div class="dashboard-grid">

                    <div class="card gradient">
                        <h3>📚 Provas</h3>
                        <p id="total-provas">0</p>
                    </div>

                    <div class="card gradient">
                        <h3>🎯 Média</h3>
                        <p id="media-acertos">0%</p>
                    </div>

                    <div class="card gradient">
                        <h3>🏆 Melhor</h3>
                        <p id="melhor-resultado">0%</p>
                    </div>

                    <div class="card gradient">
                        <h3>⚡ Nível</h3>
                        <p id="nivel">1</p>
                    </div>

                </div>

                <div class="card">
                    <canvas id="graficoDesempenho"></canvas>
                </div>

                <div id="resultado"></div>
            </section>

            <!-- RANKING -->
            <section id="ranking" class="section hidden">
                <h1>🏆 Ranking</h1>
                <div id="ranking-container"></div>
            </section>

            <!-- REDAÇÃO -->
            <section id="redacao" class="section hidden">
                <h1>Redação</h1>

                <input
                    type="text"
                    id="tema-redacao"
                    placeholder="Tema"
                >

                <textarea
                    id="texto-redacao"
                    placeholder="Digite sua redação aqui..."
                ></textarea>

                <button id="enviar-redacao">
                    Corrigir
                </button>

                <div id="feedback-redacao"></div>
            </section>

            <!-- CONFIG -->
            <section id="config" class="section hidden">
                <h1>Configurações</h1>

                <div class="card">
                    <label for="tema-toggle">
                        Tema Escuro
                    </label>

                    <input
                        type="checkbox"
                        id="tema-toggle"
                    >
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>

</body>
</html>
