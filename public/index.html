<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Simulado ENEM</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Loading -->


  <div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>🎓 FórmulaVest</h2>

      <ul>
        <li data-section="gerar" class="active">Gerar Prova</li>
        <li data-section="enem">Simulado ENEM</li>
        <li data-section="dashboard">Dashboard</li>
        <li data-section="ranking">Ranking</li>
        <li data-section="redacao">Redação</li>
      </ul>

      <button id="logout-btn" class="btn-red">
        Logout
      </button>
    </aside>

    <!-- Conteúdo -->
    <main class="main-content">

      <!-- GERAR -->
      <section id="gerar" class="section">
        <h1>Gerar Prova</h1>

        <div class="card">
          <input id="faculdade" placeholder="Faculdade">
          <input id="curso" placeholder="Curso">
          <input id="quantidade" type="number" placeholder="Quantidade">

          <button id="gerar-btn">
            Gerar Prova
          </button>
        </div>

        <div id="prova-container"></div>

        <button
          id="finalizar-btn"
          class="hidden success-btn"
        >
          Finalizar
        </button>
      </section>

      <!-- DASHBOARD -->
      <section
        id="dashboard"
        class="section hidden"
      >
        <h1>Dashboard</h1>
      </section>

      <!-- RANKING -->
      <section
        id="ranking"
        class="section hidden"
      >
        <h1>Ranking</h1>
        <div id="ranking-container"></div>
      </section>

      <!-- REDAÇÃO -->
      <section
        id="redacao"
        class="section hidden"
      >
        <h1>Redação</h1>

        <input
          id="tema-redacao"
          placeholder="Tema"
        >

        <textarea
          id="texto-redacao"
          placeholder="Digite sua redação..."
        ></textarea>

        <button id="enviar-redacao">
          Corrigir
        </button>

        <div id="feedback-redacao"></div>
      </section>

    </main>
  </div>

</body>
</html>
