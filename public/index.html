<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>FórmulaVest</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>🎓 FórmulaVest</h2>

      <ul>
        <li
          data-section="enem"
          class="active"
        >
          Simulado ENEM
        </li>

        <li data-section="provao">
          Provão Paulista
        </li>

        <li data-section="dashboard">
          Dashboard
        </li>

        <li data-section="ranking">
          Ranking
        </li>

        <li data-section="redacao">
          Redação
        </li>
      </ul>

      <button
        id="logout-btn"
        class="btn-red"
      >
        Logout
      </button>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

      <!-- ENEM -->
      <section
        id="enem"
        class="section"
      >
        <h1>📘 Simulado ENEM</h1>

        <div class="card">
          <p>
            Gere uma prova estilo ENEM.
          </p>

          <button id="gerar-enem-btn">
            Gerar ENEM
          </button>
        </div>

        <div id="enem-container"></div>

        <button
          id="finalizar-enem-btn"
          class="hidden success-btn"
        >
          Finalizar
        </button>
      </section>

      <!-- PROVÃO -->
      <section
        id="provao"
        class="section hidden"
      >
        <h1>📗 Provão Paulista</h1>

        <div class="card">
          <p>
            Gere uma prova estilo
            Provão Paulista.
          </p>

          <button id="gerar-provao-btn">
            Gerar Provão
          </button>
        </div>

        <div id="provao-container"></div>

        <button
          id="finalizar-provao-btn"
          class="hidden success-btn"
        >
          Finalizar
        </button>
      </section>

      <!-- DASHBOARD -->
      <section
        id="dashboard"
        class="section hidden"
      >
        <h1>📊 Dashboard</h1>

        <div id="dashboard-container"></div>
      </section>

      <!-- RANKING -->
      <section
        id="ranking"
        class="section hidden"
      >
        <h1>🏆 Ranking</h1>

        <div id="ranking-container"></div>
      </section>

      <!-- REDAÇÃO -->
      <section
        id="redacao"
        class="section hidden"
      >
        <h1>✍️ Redação</h1>

        <input
          id="tema-redacao"
          placeholder="Tema"
        >

        <textarea
          id="texto-redacao"
          placeholder="Digite sua redação..."
        ></textarea>

        <button id="enviar-redacao">
          Corrigir
        </button>

        <div id="feedback-redacao"></div>
      </section>

    </main>
  </div>

</body>
</html>
