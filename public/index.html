<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FórmulaVest</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>

  <style>
    /* bolinha perfil */
    .profile-circle {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2ecc71;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      z-index: 999;
    }
  </style>
</head>

<body>

<!-- PERFIL BUTTON -->
<div class="profile-circle" onclick="window.location.href='perfil.html'">
  👤
</div>

<!-- TIMER -->
<div id="timer-bar" style="display:none;">
  ⏱ Tempo restante: <span id="timer">00:00:00</span>
</div>

<div class="app-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>🎓 FórmulaVest</h2>

    <ul>
      <li data-section="enem" class="active">Simulado ENEM</li>
      <li data-section="provao">Provão Paulista</li>
      <li data-section="dashboard">Dashboard</li>
      <li data-section="ranking">Ranking</li>
      <li data-section="redacao">Redação</li>
    </ul>

    <button id="logout-btn">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- ENEM -->
    <section id="enem" class="section">
      <h1>📘 Simulado ENEM</h1>

      <div class="card">
        <button id="gerar-enem-btn">Gerar ENEM</button>
      </div>

      <div id="enem-container"></div>

      <button id="finalizar-enem-btn" class="hidden">
        Finalizar ENEM
      </button>
    </section>

    <!-- PROVÃO -->
    <section id="provao" class="section hidden">
      <h1>📗 Provão Paulista</h1>

      <div class="card">
        <button id="gerar-provao-btn">Gerar Provão</button>
      </div>

      <div id="provao-container"></div>

      <button id="finalizar-provao-btn" class="hidden">
        Finalizar Provão
      </button>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard" class="section hidden">
      <h1>📊 Dashboard</h1>

      <div id="dashboard-container"></div>

      <div>
        <h2>Nível: <span id="nivel-user">1</span></h2>
        <p>XP: <span id="xp-total">0</span></p>

        <div style="width:100%; background:#ddd;">
          <div id="xp-bar-fill" style="height:10px;width:0;background:green;"></div>
        </div>

        <p id="streak-days"></p>
      </div>

      <canvas id="graficoEvolucao"></canvas>
    </section>

    <!-- RANKING -->
    <section id="ranking" class="section hidden">
      <h1>🏆 Ranking</h1>

      <div id="top3"></div>
      <div id="ranking-list"></div>
    </section>

    <!-- REDAÇÃO -->
    <section id="redacao" class="section hidden">
      <h1>✍️ Redação ENEM</h1>

      <input id="tema-redacao" placeholder="Tema">
      <textarea id="texto-redacao" placeholder="Sua redação..."></textarea>

      <button id="enviar-redacao">Corrigir redação</button>

      <div id="feedback-redacao"></div>
    </section>

  </main>
</div>

<!-- FINAL SCREEN -->
<div id="final-screen" class="hidden">
  <div>
    <h1>Resultado</h1>
    <p id="final-text"></p>

    <button onclick="document.getElementById('final-screen').classList.add('hidden')">
      Fechar
    </button>
  </div>
</div>

</body>
</html>
