<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - FórmulaVest</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

  <h1>🎓 FórmulaVest</h1>

  <!-- LOGIN -->
  <div class="card">
    <h2>Entrar</h2>

    <input
      type="email"
      id="login-email"
      placeholder="Email"
    >

    <input
      type="password"
      id="login-senha"
      placeholder="Senha"
    >

    <button id="login-btn">
      Entrar
    </button>
  </div>

  <!-- REGISTER -->
  <div class="card">
    <h2>Criar conta</h2>

    <input
      type="text"
      id="register-username"
      placeholder="Nome de usuário"
    >

    <input
      type="email"
      id="register-email"
      placeholder="Email"
    >

    <input
      type="password"
      id="register-senha"
      placeholder="Senha (mínimo 8)"
    >

    <button id="register-btn">
      Registrar
    </button>
  </div>

  <!-- VERIFICAÇÃO -->
  <div
    class="card hidden"
    id="verificacao-box"
  >
    <h2>Confirmar email</h2>

    <input
      type="email"
      id="verify-email"
      placeholder="Email"
    >

    <input
      type="text"
      id="verify-code"
      placeholder="Código de 6 dígitos"
    >

    <button id="verify-btn">
      Verificar código
    </button>
  </div>

</div>

<script src="login.js"></script>
</body>
</html>
